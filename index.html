<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Office — Tim AI 0xndrean7</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fdf6ec; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #2b2118; max-width: 480px; margin: 0 auto; padding: 0 0 24px;
    -webkit-text-size-adjust: 100%;
  }
  header { padding: 16px 16px 8px; text-align: center; }
  header h1 { font-size: 21px; letter-spacing: .5px; }
  header p { font-size: 13px; color: #7a6a58; margin-top: 4px; }
  .rail {
    display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;
    padding: 10px 12px 4px;
  }
  .rail span {
    font-size: 10px; font-weight: 700; letter-spacing: .4px;
    padding: 4px 8px; border-radius: 999px; background: #efe3d0; color: #8a7a66;
    transition: background .3s, color .3s;
  }
  .rail span.on { background: #2b2118; color: #fff; }
  .scene { width: 100%; display: block; }
  .status {
    margin: 10px 16px 0; padding: 10px 12px; background: #fff; border: 1px solid #eadfc9;
    border-radius: 12px; font-size: 13px; line-height: 1.45; min-height: 42px;
  }
  .status b { color: #b3541e; }
  .dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: #b3541e; margin-right: 2px; animation: blink 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
  .legend { padding: 12px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .legend div {
    display: flex; align-items: center; gap: 7px; font-size: 12px;
    background: #fff; border: 1px solid #eadfc9; border-radius: 10px; padding: 7px 9px;
  }
  .legend i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend small { display: block; color: #8a7a66; font-size: 10px; }
  footer { text-align: center; padding: 16px; font-size: 12px; color: #7a6a58; }
  footer a { color: #b3541e; font-weight: 700; text-decoration: none; word-break: break-all; }

  /* --- chibi figure motion --- */
  .bob { animation: bob var(--bobd, 2.6s) ease-in-out infinite; animation-delay: var(--bobdelay, 0s); }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .typing .fa-l, .typing .fa-r { animation: type .5s ease-in-out infinite alternate; }
  .typing .fa-r { animation-delay: .25s; }
  @keyframes type { from { transform: rotate(0deg); } to { transform: rotate(-9deg); } }
  .screen { animation: glow 2.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  .codeline { animation: flick 1.6s steps(2, end) infinite; }
  @keyframes flick { 0%,100% { opacity: .95; } 50% { opacity: .35; } }
  .plant { transform-origin: 50% 100%; transform-box: fill-box; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  .lampglow { animation: glow 3s ease-in-out infinite; }
  .steam { animation: steam 2.2s ease-in-out infinite; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(2px); } 40% { opacity: .7; } 100% { opacity: 0; transform: translateY(-6px); } }
  .sip { transform-box: fill-box; transform-origin: 50% 100%; animation: sip 7s ease-in-out infinite; }
  @keyframes sip { 0%,28%,55%,100% { transform: rotate(0deg); } 35%,48% { transform: rotate(-16deg); } }
  .dusk { animation: dusk 90s ease-in-out infinite alternate; }
  @keyframes dusk { from { opacity: 0; } to { opacity: .07; } }
  .bubble { opacity: 0; transform: translateY(6px) scale(.92); transform-box: fill-box;
    transform-origin: 50% 100%; transition: opacity .35s, transform .35s; pointer-events: none; }
  .bubble.on { opacity: 1; transform: translateY(0) scale(1); }
  .seatFig { transition: opacity .3s; }
  /* faces: happy variant shows when the figure's group has .happy */
  .face .h { display: none; }
  .happy .face .h { display: block; }
  .happy .face .n { display: none; }
  /* stretch: both arms go up */
  .stretch .armL, .stretch .armR { transform: rotate(-150deg) !important; }
  .stretch .armL .fa-l, .stretch .armR .fa-r { animation: none; }
  /* cheer: arms up + bounce */
  .cheer .armL, .cheer .armR { transform: rotate(-155deg) !important; }
  .cheer .figbody { animation: cheerbob .5s ease-in-out infinite; }
  @keyframes cheerbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  /* delivery pop burst */
  #popFx { opacity: 0; transition: opacity .25s; pointer-events: none; }
  #popFx.on { opacity: 1; }
  #popFx .popin { transform-box: fill-box; transform-origin: 50% 50%; }
  #popFx.on .popin { animation: popfx .55s ease-out; }
  @keyframes popfx { 0% { transform: scale(.4); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  /* confetti */
  .confetti rect { animation: confettiFall linear forwards; }
  @keyframes confettiFall {
    0% { transform: translateY(-12px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(560px) rotate(540deg); opacity: .85; }
  }
  /* --- walking chibi --- */
  .walker { opacity: 0; transition: opacity .3s; pointer-events: none; }
  .walker.on { opacity: 1; }
  .wflip { transition: none; }
  .walker .thigh { transform-box: fill-box; transform-origin: 50% 0; animation: thighSwing .9s ease-in-out infinite; }
  .walker .thigh.b { animation-delay: -.45s; }
  .walker .shin { transform-box: fill-box; transform-origin: 50% 0; animation: shinSwing .9s ease-in-out infinite; }
  .walker .shin.b { animation-delay: -.45s; }
  .walker .armW { transform-box: fill-box; transform-origin: 50% 0; animation: armSwing .9s ease-in-out infinite; }
  .walker .armW.b { animation-delay: -.45s; }
  .walker.still .thigh, .walker.still .shin, .walker.still .armW { animation: none; }
  .wbob { animation: wbob .45s ease-in-out infinite; }
  .walker.still .wbob { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes thighSwing { 0%,100% { transform: rotate(16deg); } 50% { transform: rotate(-16deg); } }
  @keyframes shinSwing { 0%,100% { transform: rotate(-26deg); } 50% { transform: rotate(2deg); } }
  @keyframes armSwing { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
  @keyframes wbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes breathe { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1px) scaleY(1.02); } }
  /* sipping / watering props shown only in that state */
  .prop-sip, .prop-water { display: none; }
  .walker.sipping .prop-sip, .walker.watering .prop-water { display: block; }
  .drop { animation: dropfall .8s ease-in infinite; }
  @keyframes dropfall { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(16px); } }
  @media (prefers-reduced-motion: reduce) {
    .bob, .screen, .codeline, .plant, .lampglow, .steam, .sip, .dusk,
    .walker .thigh, .walker .shin, .walker .armW, .wbob, .confetti rect, .drop { animation: none; }
  }
</style>

            <g transform="rotate(-24 14 -36)"><rect x="10" y="-44" width="12" height="9" rx="2" fill="#7fb3d5"/><rect x="20" y="-41" width="8" height="3" fill="#5d8fb0"/></g>
            <circle class="drop" cx="28" cy="-34" r="1.8" fill="#4aa8e0"/>
            <circle class="drop" cx="31" cy="-30" r="1.5" fill="#4aa8e0" style="animation-delay:.3s"/>
            <circle class="drop" cx="25" cy="-28" r="1.5" fill="#4aa8e0" style="animation-delay:.55s"/>
          </g>
        </g>
      </g>
    </g>
    ${nameTag(r.short, r.color, r.kd, -104)}
   </g>`;
  return g;
}
function setHappy(r, on) {
  if (!r.seatFig || !r.walker) return;
  r.seatFig.classList.toggle('happy', on);
  r.walker.classList.toggle('happy', on);
}

/* ---------- bubbles + legend ---------- */
const bubblesEl = document.getElementById('bubbles');
ROLES.forEach(r => {
  const wrap = document.createElementNS(NS, 'g');
  wrap.setAttribute('transform', `translate(${r.x},${r.y - 128})`);
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'bubble');
  g.setAttribute('data-bubble', r.id);
  const w = 172, h = 56, x = -w / 2;
  g.innerHTML =
    `<rect x="${x}" y="0" width="${w}" height="${h}" rx="12" fill="#fff" stroke="#eadfc9"/>` +
    `<rect x="${x + 8}" y="6" width="46" height="14" rx="7" fill="${r.color}"/>` +
    `<text x="${x + 31}" y="16" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">${r.step.toUpperCase()}</text>` +
    `<text class="bl1" x="0" y="36" font-size="12.5" text-anchor="middle" fill="#2b2118">${r.lines[0]}</text>` +
    `<text class="bl2" x="0" y="51" font-size="12.5" text-anchor="middle" fill="#2b2118">${r.lines[1]}</text>` +
    `<polygon points="-7,${h} 7,${h} 0,${h + 10}" fill="#fff" stroke="#eadfc9"/>`;
  wrap.appendChild(g);
  bubblesEl.appendChild(wrap);
  r.bubbleWrap = wrap; r.bl1 = g.querySelector('.bl1'); r.bl2 = g.querySelector('.bl2');
});
const legendEl = document.getElementById('legend');
ROLES.forEach(r => {
  const d = document.createElement('div');
  d.innerHTML = `<i style="background:${r.color}"></i><span>${r.short}<small>${r.id} → ${r.file}</small></span>`;
  legendEl.appendChild(d);
});

/* ---------- build figures ---------- */
const seatsEl = document.getElementById('seats');
const walkersEl = document.getElementById('walkers');
ROLES.forEach(r => {
  const seat = buildSeatFigure(r);
  seat.setAttribute('id', 'seat-' + r.id);
  seat.setAttribute('transform', r.id === 'office-hours' ? 'translate(195,178)' : `translate(${r.x},${r.y + 18})`);
  seatsEl.appendChild(seat);
  r.seatFig = seat;
  const w = buildWalker(r);
  walkersEl.appendChild(w);
  r.walker = w;
  r.home = r.id === 'office-hours' ? { x: 200, y: 188 } : { x: r.x, y: r.y + 18 };
  r.pos = { ...r.home };
  r.state = 'seated'; r.facing = 1; r.destLabel = ''; r.destKind = '';
  r.path = []; r.seg = 0; r.from = null; r.to = null; r.dist = 0; r.done = 0;
  r.pauseT = 0; r.riseT = 0; r.settleT = 0; r.idleT = 1 + Math.random() * 6;
});
/* lounge friends (chibi, no name tags) */
const loungeEl = document.getElementById('loungeSeats');
[
  { id: 'lounge-a', color: '#e67e22', hair: '#2c2c2c', skin: '#e8b88a', hairStyle: 'messy', scale: 0.85, lean: -4, bobd: 2.4, bobdelay: 0, armStyle: 'rest', plaid: false, short: 'A', kd: '' },
  { id: 'lounge-b', color: '#16a085', hair: '#111111', skin: '#f2c89b', hairStyle: 'flat', scale: 0.85, lean: 4, bobd: 2.9, bobdelay: 0.8, armStyle: 'rest', plaid: false, short: 'B', kd: '' },
].forEach((f, i) => {
  const seat = buildSeatFigure(f, { noTag: true });
  seat.setAttribute('id', 'seat-' + f.id);
  seat.setAttribute('transform', `translate(${i === 0 ? 78 : 132},706)`);
  loungeEl.appendChild(seat);
  if (i === 0) seat.classList.add('happy');
});

/* ---------- walking: sambil mengerjakan + ambient life ---------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = 85;
const MAX_WALKERS = 4;
const SPOTS = {
  meeting: { x: 200, y: 196, label: 'meja meeting', kind: 'deliver' },
  lounge: { x: 170, y: 700, label: 'lounge', kind: 'chat' },
  coffee: { x: 342, y: 638, label: 'coffee corner', kind: 'coffee' },
  plant: { x: 48, y: 308, label: 'tanaman', kind: 'plant' },
};
function deskSpot(t) {
  return { x: t.x < 200 ? t.x + 72 : t.x - 72, y: t.y + 22, label: 'meja ' + t.short, kind: 'deliver' };
}
const LANES = [196, 308, 418, 528, 638, 700];
function nearestLane(y) { let best = LANES[0]; for (const L of LANES) if (Math.abs(L - y) < Math.abs(best - y)) best = L; return best; }
function route(from, to) {
  const pts = [];
  const fl = nearestLane(from.y), tl = nearestLane(to.y);
  pts.push({ x: from.x, y: fl });
  if (fl !== tl) {
    if (from.x !== 200) pts.push({ x: 200, y: fl });
    pts.push({ x: 200, y: tl });
  }
  if (to.x !== 200) pts.push({ x: to.x, y: tl });
  pts.push({ x: to.x, y: to.y });
  return pts.filter((p, i) => i === 0 || p.x !== pts[i - 1].x || p.y !== pts[i - 1].y);
}
function walkersActive() { return ROLES.filter(r => r.state !== 'seated').length; }
function setBubbleText(r, l1, l2) { r.bl1.textContent = l1; r.bl2.textContent = l2; }
function restoreBubbleText(r) { setBubbleText(r, r.lines[0], r.lines[1]); }
const popFx = document.getElementById('popFx');
function showPop(x, y) {
  popFx.setAttribute('transform', `translate(${x},${y - 88})`);
  popFx.classList.remove('on');
  void popFx.getBBox();
  requestAnimationFrame(() => popFx.classList.add('on'));
}
function hidePop() { popFx.classList.remove('on'); }
function startTrip(r) {
  if (REDUCED || r.state !== 'seated' || walkersActive() >= MAX_WALKERS) return false;
  const roll = Math.random();
  let dest;
  if (roll < 0.26) dest = SPOTS.meeting;
  else if (roll < 0.40) dest = SPOTS.lounge;
  else if (roll < 0.54) dest = SPOTS.coffee;
  else if (roll < 0.66) dest = SPOTS.plant;
  else { const others = ROLES.filter(o => o.id !== r.id); dest = deskSpot(others[Math.floor(Math.random() * others.length)]); }
  r.dest = dest; r.destLabel = dest.label; r.destKind = dest.kind;
  r.outPath = route(r.home, dest);
  r.backPath = route(dest, r.home);
  r.path = r.outPath; r.seg = 0;
  r.state = 'rising'; r.riseT = 0.28; r.phase = 'out';
  r.seatFig.style.opacity = 0;
  r.walker.classList.remove('still', 'sipping', 'watering');
  r.walker.classList.add('on');
  setBubbleText(r, `Bawa ${r.shortFile}`, `ke ${dest.label}…`);
  return true;
}
function beginSeg(r) {
  r.from = { ...r.pos };
  r.to = r.path[r.seg];
  r.dist = Math.hypot(r.to.x - r.from.x, r.to.y - r.from.y) || 1;
  r.done = 0;
  if (r.to.x !== r.from.x) r.facing = r.to.x > r.from.x ? 1 : -1;
}
function arrive(r) {
  const k = r.destKind;
  r.walker.classList.add('still');
  setHappy(r, true);
  if (k === 'coffee') {
    r.state = 'sipping'; r.pauseT = 2.6;
    r.walker.classList.add('sipping');
    setBubbleText(r, 'ngopi dulu… ☕', 'habis ini lanjut');
  } else if (k === 'plant') {
    r.state = 'watering'; r.pauseT = 2.2;
    r.walker.classList.add('watering');
    setBubbleText(r, 'siram tanaman 🌱', 'biar seger');
  } else if (k === 'chat') {
    r.state = 'chatting'; r.pauseT = 2.4;
    setBubbleText(r, 'eh, deploy aman kok', 'sprint ini lancar!');
  } else {
    r.state = 'paused'; r.pauseT = 1.6;
    showPop(r.pos.x, r.pos.y);
  }
}
function leaveSpot(r) {
  hidePop();
  r.walker.classList.remove('sipping', 'watering', 'still');
  r.state = 'returning'; r.path = r.backPath; r.seg = 0;
  beginSeg(r);
}
function stepWalk(r, dt) {
  if (r.state === 'rising') {
    r.riseT -= dt;
    if (r.riseT <= 0) { r.state = 'walking'; beginSeg(r); }
    return;
  }
  if (r.state === 'settling') {
    r.settleT -= dt;
    if (r.settleT <= 0) {
      r.state = 'seated'; r.pos = { ...r.home };
      restoreBubbleText(r);
      setHappy(r, r === ROLES[idx]);
      r.idleT = 2 + Math.random() * 4;
    }
    return;
  }
  if (r.state === 'paused' || r.state === 'sipping' || r.state === 'watering' || r.state === 'chatting') {
    r.pauseT -= dt;
    if (r.pauseT <= 0) leaveSpot(r);
    return;
  }
  if (r.state !== 'walking' && r.state !== 'returning') return;
  r.done += SPEED * dt;
  const tRaw = Math.min(1, r.done / r.dist);
  const t = tRaw * tRaw * (3 - 2 * tRaw);
  r.pos.x = r.from.x + (r.to.x - r.from.x) * t;
  r.pos.y = r.from.y + (r.to.y - r.from.y) * t;
  if (tRaw >= 1) {
    r.seg++;
    if (r.seg >= r.path.length) {
      if (r.phase === 'out') { r.phase = 'arrived'; arrive(r); }
      else {
        r.state = 'settling'; r.settleT = 0.3;
        r.walker.classList.remove('on');
        r.seatFig.style.opacity = 1;
      }
    } else beginSeg(r);
  }
}
const walkRing = document.getElementById('walkRing');
const statusTextEl = document.getElementById('statusText');
let lastStatus = '';
let lastFrame = performance.now();
let stretchTimer = 6, stretchTarget = null, stretchT = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  if (!REDUCED) {
    ROLES.forEach(r => {
      if (r.state === 'seated') { r.idleT -= dt; if (r.idleT <= 0 && !startTrip(r)) r.idleT = 0.5; }
      else stepWalk(r, dt);
      const bx = Math.max(92, Math.min(308, r.pos.x));
      const by = r.state === 'seated' ? r.pos.y - 150 : r.pos.y - 170;
      r.bubbleWrap.setAttribute('transform', `translate(${bx},${by})`);
      r.walker.setAttribute('transform', `translate(${r.pos.x},${r.pos.y})`);
      const flip = r.walker.querySelector('.wflip');
      if (flip) flip.style.transform = r.facing < 0 ? 'scale(-1,1)' : 'scale(1,1)';
    });
    /* occasional stretch at the desk */
    stretchTimer -= dt;
    if (stretchTimer <= 0 && !stretchTarget) {
      const seated = ROLES.filter(r => r.state === 'seated');
      if (seated.length) { stretchTarget = seated[Math.floor(Math.random() * seated.length)]; stretchTarget.seatFig.classList.add('stretch'); stretchT = 1.6; }
      stretchTimer = 8 + Math.random() * 6;
    }
    if (stretchTarget) {
      stretchT -= dt;
      if (stretchT <= 0) { stretchTarget.seatFig.classList.remove('stretch'); stretchTarget = null; }
    }
    const a = ROLES[idx];
    if (a.state === 'walking' || a.state === 'returning') {
      walkRing.setAttribute('cx', a.pos.x); walkRing.setAttribute('cy', a.pos.y + 3);
      walkRing.style.opacity = 1;
    } else walkRing.style.opacity = 0;
    let st;
    if (celebrating) st = '🎉 <b>Sprint selesai!</b> Semua cheers — sprint baru mulai!';
    else if (a.state === 'sipping') st = `${a.short} lagi <b>ngopi</b> di coffee corner…`;
    else if (a.state === 'watering') st = `${a.short} lagi <b>siram tanaman</b>…`;
    else if (a.state === 'chatting') st = `${a.short} lagi <b>ngobrol</b> di lounge…`;
    else if (a.state !== 'seated') st = `${a.short} lagi bawa <b>${a.shortFile}</b> ke ${a.destLabel}…`;
    else st = a.status;
    if (st !== lastStatus) { statusTextEl.innerHTML = st; lastStatus = st; }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- celebration: full sprint done → everyone cheers + confetti ---------- */
const confettiEl = document.getElementById('confetti');
let celebrating = false;
function celebrate() {
  if (celebrating || REDUCED) return;
  celebrating = true;
  ROLES.forEach(r => { r.seatFig.classList.add('cheer'); setHappy(r, true); r.walker.classList.add('still'); });
  const colors = ['#e74c3c', '#f39c12', '#f7c948', '#27ae60', '#3498db', '#9b59b6', '#e91e63', '#00bcd4'];
  for (let i = 0; i < 36; i++) {
    const p = document.createElementNS(NS, 'rect');
    p.setAttribute('x', 20 + Math.random() * 360);
    p.setAttribute('y', -10 - Math.random() * 40);
    p.setAttribute('width', 5 + Math.random() * 4);
    p.setAttribute('height', 3 + Math.random() * 3);
    p.setAttribute('fill', colors[i % colors.length]);
    p.style.animationDuration = (2.2 + Math.random() * 1.2) + 's';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    confettiEl.appendChild(p);
  }
  setTimeout(() => {
    ROLES.forEach(r => { r.seatFig.classList.remove('cheer'); setHappy(r, r === ROLES[idx]); });
    confettiEl.innerHTML = '';
    celebrating = false;
  }, 3000);
}

/* ---------- wall clock (real time) ---------- */
function tickClock() {
  const d = new Date();
  const m = d.getMinutes() * 6 + d.getSeconds() * 0.1;
  const h = (d.getHours() % 12) * 30 + d.getMinutes() * 0.5;
  document.getElementById('clockMin').setAttribute('transform', `rotate(${m})`);
  document.getElementById('clockHour').setAttribute('transform', `rotate(${h})`);
}
tickClock();
setInterval(tickClock, 1000);

/* ---------- lounge friends chat ---------- */
const loungeBubble = document.getElementById('loungeBubble');
const loungeText = document.getElementById('loungeText');
const LOUNGE_LINES = ['☕ ngopi dulu…', 'deploy aman kok', 'sprint ini lancar!', 'habis ini makan siang'];
let loungeI = 0;
if (!REDUCED) {
  setInterval(() => {
    loungeText.textContent = LOUNGE_LINES[loungeI % LOUNGE_LINES.length];
    loungeBubble.setAttribute('transform', `translate(${loungeI % 2 === 0 ? 78 : 132},588)`);
    loungeI++;
    loungeBubble.style.opacity = 1;
    setTimeout(() => { loungeBubble.style.opacity = 0; }, 2600);
  }, 6000);
}

/* ---------- sprint bubble cycle ---------- */
const rail = document.getElementById('rail');
const statusText = document.getElementById('statusText');
let idx = 0, timer = null;
function show(n) {
  const prev = idx;
  idx = (n + ROLES.length) % ROLES.length;
  if (prev === ROLES.length - 1 && idx === 0) celebrate();
  const r = ROLES[idx];
  document.querySelectorAll('.bubble').forEach(b => b.classList.toggle('on', b.dataset.bubble === r.id));
  ROLES.forEach(x => {
    const ring = document.getElementById('ring-' + x.id); if (ring) ring.style.opacity = x.id === r.id ? 1 : 0;
    setHappy(x, x.id === r.id);
  });
  rail.querySelectorAll('span').forEach(s => s.classList.toggle('on', s.dataset.step === r.step));
  statusText.innerHTML = r.status;
  if (Math.random() < 0.7) startTrip(r);
}
function next() { show(idx + 1); }
function restart() { clearInterval(timer); timer = setInterval(next, 3000); }
show(0); restart();
document.querySelectorAll('[data-role]').forEach(g =>
  g.addEventListener('click', () => { show(ROLES.findIndex(r => r.id === g.dataset.role)); restart(); }));

/* debug hook for verification */
window.__office = {
  positions: () => ROLES.map(r => ({ id: r.id, x: Math.round(r.pos.x), y: Math.round(r.pos.y), state: r.state, dest: r.destLabel || null, kind: r.destKind || null })),
  walkingCount: () => ROLES.filter(r => r.state !== 'seated').length,
  activeRole: () => ROLES[idx].id,
  activeBubble: () => (document.querySelector('.bubble.on') || {}).dataset?.bubble || null,
  overlayCount: () => document.querySelectorAll('.acc').length,
  faceCount: () => document.querySelectorAll('.face').length,
  happyCount: () => document.querySelectorAll('.happy').length,
  seatCount: () => document.querySelectorAll('.seatFig').length,
  nameTagCount: () => document.querySelectorAll('.nametag').length,
  dualMonitors: () => document.querySelectorAll('#deskOnly .screen').length,
  clockMin: () => document.getElementById('clockMin').getAttribute('transform'),
  celebrating: () => celebrating,
  confettiCount: () => document.querySelectorAll('#confetti rect').length,
  cheerCount: () => document.querySelectorAll('.cheer').length,
  celebrate: () => celebrate(),
  states: () => ROLES.map(r => r.state),
};
</script>
