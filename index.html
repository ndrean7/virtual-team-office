<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Office — Tim AI 0xndrean7</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fdf6ec; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #2b2118; max-width: 480px; margin: 0 auto; padding: 0 0 24px;
    -webkit-text-size-adjust: 100%;
  }
  header { padding: 16px 16px 8px; text-align: center; }
  header h1 { font-size: 21px; letter-spacing: .5px; }
  header p { font-size: 13px; color: #7a6a58; margin-top: 4px; }
  .rail {
    display: flex; gap: 4px; justify-content: center; flex-wrap: wrap;
    padding: 10px 12px 4px;
  }
  .rail span {
    font-size: 10px; font-weight: 700; letter-spacing: .4px;
    padding: 4px 8px; border-radius: 999px; background: #efe3d0; color: #8a7a66;
    transition: background .3s, color .3s;
  }
  .rail span.on { background: #2b2118; color: #fff; }
  .scene { width: 100%; display: block; }
  .status {
    margin: 10px 16px 0; padding: 10px 12px; background: #fff; border: 1px solid #eadfc9;
    border-radius: 12px; font-size: 13px; line-height: 1.45; min-height: 42px;
  }
  .status b { color: #b3541e; }
  .dots i { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: #b3541e; margin-right: 2px; animation: blink 1s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
  .legend { padding: 12px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .legend div {
    display: flex; align-items: center; gap: 7px; font-size: 12px;
    background: #fff; border: 1px solid #eadfc9; border-radius: 10px; padding: 7px 9px;
  }
  .legend i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend small { display: block; color: #8a7a66; font-size: 10px; }
  footer { text-align: center; padding: 16px; font-size: 12px; color: #7a6a58; }
  footer a { color: #b3541e; font-weight: 700; text-decoration: none; word-break: break-all; }

  /* --- SVG animation --- */
  .bob { animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  .screen { animation: glow 2.2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  .plant { transform-origin: 50% 100%; transform-box: fill-box; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
  .bubble { opacity: 0; transform: translateY(6px) scale(.92); transform-box: fill-box;
    transform-origin: 50% 100%; transition: opacity .35s, transform .35s; pointer-events: none; }
  .bubble.on { opacity: 1; transform: translateY(0) scale(1); }
  .seatFig { transition: opacity .3s; }
  /* --- walking character --- */
  .walker { opacity: 0; transition: opacity .3s; pointer-events: none; }
  .walker.on { opacity: 1; }
  .walker .leg { transform-box: fill-box; transform-origin: 50% 0; animation: swing .45s ease-in-out infinite alternate; }
  .walker .leg.b { animation-delay: -.225s; }
  .walker.still .leg, .walker.still .wbob { animation: none; }
  .wbob { animation: wbob .45s ease-in-out infinite; }
  @keyframes swing { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
  @keyframes wbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) {
    .bob, .screen, .plant { animation: none; }
  }
</style>
</head>

<script>
const ROLES = [
  { id:'office-hours', short:'CEO', color:'#e74c3c', hair:'#2c2c2c', skin:'#f2c89b', step:'Think', x:200, y:150, file:'.team/brief.md', shortFile:'brief.md',

  { id:'planner', short:'Planner', color:'#3498db', hair:'#3b2f2f', skin:'#f2c89b', step:'Plan', x:100, y:250, file:'.team/design.md', shortFile:'design.md',
    lines:['Desain selesai,','builder gas!'], status:'Planner lagi nulis <b>design.md</b>…' },
  { id:'builder', short:'Builder', color:'#f39c12', hair:'#1f1f1f', skin:'#e8b88a', step:'Build', x:300, y:250, file:'.team/build-log.md', shortFile:'build-log.md',
    lines:['Build kelar,','cek review ya'], status:'Builder lagi nulis <b>build-log.md</b>…' },
  { id:'reviewer', short:'Reviewer', color:'#9b59b6', hair:'#4a2c14', skin:'#f2c89b', step:'Review', x:100, y:360, file:'.team/review.md', shortFile:'review.md',
    lines:['Review oke,','lanjut QA'], status:'Reviewer lagi nulis <b>review.md</b>…' },
  { id:'qa', short:'QA', color:'#1abc9c', hair:'#2c2c2c', skin:'#d9a06b', step:'Test', x:300, y:360, file:'.team/qa-report.md', shortFile:'qa-report.md',
    lines:['QA lolos,','semua aman'], status:'QA lagi nulis <b>qa-report.md</b>…' },
  { id:'security-officer', short:'Security', color:'#2c3e50', hair:'#111111', skin:'#f2c89b', step:'Test', x:100, y:470, file:'.team/security-report.md', shortFile:'security-report.md',
    lines:['Security bersih,','no celah'], status:'Security lagi nulis <b>security-report.md</b>…' },
  { id:'finance-officer', short:'Finance', color:'#27ae60', hair:'#5b3a1e', skin:'#e8b88a', step:'Ship', x:300, y:470, file:'.team/finance.md', shortFile:'finance.md',
    lines:['Budget aman,','semua tercatat'], status:'Finance lagi nulis <b>finance.md</b>…' },
  { id:'content-creator', short:'Content', color:'#e91e63', hair:'#2c2c2c', skin:'#f2c89b', step:'Ship', x:100, y:580, file:'.team/content.md', shortFile:'content.md',
    lines:['Caption siap,','posting gas!'], status:'Content lagi nulis <b>content.md</b>…' },
  { id:'release-engineer', short:'Release', color:'#00bcd4', hair:'#3b2f2f', skin:'#d9a06b', step:'Reflect', x:300, y:580, file:'.team/release.md', shortFile:'release.md',
    lines:['Siap deploy,','nunggu izin'], status:'Release lagi nulis <b>release.md</b>…' },
];
const NS = 'http://www.w3.org/2000/svg';
const bubblesEl = document.getElementById('bubbles');
ROLES.forEach(r => {
  const wrap = document.createElementNS(NS, 'g');
  wrap.setAttribute('transform', `translate(${r.x},${r.y - 108})`);
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'bubble');
  g.setAttribute('data-bubble', r.id);
  const w = 172, h = 56, x = -w / 2;
  g.innerHTML =
    `<rect x="${x}" y="0" width="${w}" height="${h}" rx="12" fill="#fff" stroke="#eadfc9"/>` +
    `<rect x="${x + 8}" y="6" width="46" height="14" rx="7" fill="${r.color}"/>` +
    `<text x="${x + 31}" y="16" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">${r.step.toUpperCase()}</text>` +
    `<text class="bl1" x="0" y="36" font-size="12.5" text-anchor="middle" fill="#2b2118">${r.lines[0]}</text>` +
    `<text class="bl2" x="0" y="51" font-size="12.5" text-anchor="middle" fill="#2b2118">${r.lines[1]}</text>` +
    `<polygon points="-7,${h} 7,${h} 0,${h + 9}" fill="#fff" stroke="#eadfc9"/>`;
  wrap.appendChild(g);
  bubblesEl.appendChild(wrap);
  r.bubbleWrap = wrap; r.bl1 = g.querySelector('.bl1'); r.bl2 = g.querySelector('.bl2');
});
const legendEl = document.getElementById('legend');
ROLES.forEach(r => {
  const d = document.createElement('div');
  d.innerHTML = `<i style="background:${r.color}"></i><span>${r.short}<small>${r.id} → ${r.file}</small></span>`;
  legendEl.appendChild(d);
});
/* ---------- walking: sambil mengerjakan — antar handoff ke spot berikut ---------- */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = 110; /* units/sec */
const MAX_WALKERS = 3;
const SPOTS = {
  meeting: { x: 200, y: 196, label: 'meja meeting' },
  lounge: { x: 150, y: 700, label: 'lounge' },
};
function deskSpot(t) { /* stand aisle-side of a desk to deliver the handoff */
  return { x: t.x < 200 ? t.x + 72 : t.x - 72, y: t.y + 22, label: 'meja ' + t.short };
}
function route(from, to) { /* via the centre aisle x=200 */
  const pts = [];
  if (from.x !== 200) pts.push({ x: 200, y: from.y });
  if (to.x !== 200) pts.push({ x: 200, y: to.y });
  pts.push({ x: to.x, y: to.y });
  return pts.filter((p, i) => i === 0 || p.x !== pts[i - 1].x || p.y !== pts[i - 1].y);
}
const walkersEl = document.getElementById('walkers');
ROLES.forEach(r => {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('class', 'walker');
  g.setAttribute('id', 'walker-' + r.id);
  g.setAttribute('style', `--shirt:${r.color};--hair:${r.hair};--skin:${r.skin}`);
  g.innerHTML = '<g class="wflip"><use href="#walker"/></g>';
  walkersEl.appendChild(g);
  r.home = r.id === 'office-hours' ? { x: 200, y: 188 } : { x: r.x, y: r.y + 18 };
  r.pos = { ...r.home };
  r.state = 'seated'; r.facing = 1; r.destLabel = '';
  r.seatFig = document.getElementById('seat-' + r.id);
  r.walker = g; r.flip = g.querySelector('.wflip');
  r.path = []; r.seg = 0; r.from = null; r.to = null; r.dist = 0; r.done = 0;
  r.pauseT = 0; r.idleT = 1 + Math.random() * 6;
});
function walkersActive() { return ROLES.filter(r => r.state !== 'seated').length; }
function setBubbleText(r, l1, l2) { r.bl1.textContent = l1; r.bl2.textContent = l2; }
function restoreBubbleText(r) { setBubbleText(r, r.lines[0], r.lines[1]); }
function startTrip(r) {
  if (REDUCED || r.state !== 'seated' || walkersActive() >= MAX_WALKERS) return false;
  const roll = Math.random();
  let dest;
  if (roll < 0.35) dest = SPOTS.meeting;
  else if (roll < 0.5) dest = SPOTS.lounge;
  else { const others = ROLES.filter(o => o.id !== r.id); dest = deskSpot(others[Math.floor(Math.random() * others.length)]); }
  r.dest = dest; r.destLabel = dest.label;
  r.outPath = route(r.home, dest);
  r.backPath = route(dest, r.home);
  r.path = r.outPath; r.seg = 0;
  r.state = 'walking'; r.phase = 'out';
  r.seatFig.style.opacity = 0;
  r.walker.classList.add('on');
  beginSeg(r);
  setBubbleText(r, `Bawa ${r.shortFile}`, `ke ${dest.label}…`);
  return true;
}
function beginSeg(r) {
  r.from = { ...r.pos };
  r.to = r.path[r.seg];
  r.dist = Math.hypot(r.to.x - r.from.x, r.to.y - r.from.y) || 1;
  r.done = 0;
  if (r.to.x !== r.from.x) r.facing = r.to.x > r.from.x ? 1 : -1;
}
function stepWalk(r, dt) {
  if (r.state === 'paused') {
    r.pauseT -= dt;
    if (r.pauseT <= 0) { r.state = 'returning'; r.path = r.backPath; r.seg = 0; r.walker.classList.remove('still'); beginSeg(r); }
    return;
  }
  if (r.state !== 'walking' && r.state !== 'returning') return;
  r.done += SPEED * dt;
  const t = Math.min(1, r.done / r.dist);
  r.pos.x = r.from.x + (r.to.x - r.from.x) * t;
  r.pos.y = r.from.y + (r.to.y - r.from.y) * t;
  if (t >= 1) {
    r.seg++;
    if (r.seg >= r.path.length) {
      if (r.phase === 'out') { r.state = 'paused'; r.pauseT = 1.6; r.walker.classList.add('still'); }
      else {
        r.state = 'seated'; r.pos = { ...r.home };
        r.seatFig.style.opacity = 1;
        r.walker.classList.remove('on');
        restoreBubbleText(r);
        r.idleT = 2 + Math.random() * 4;
      }
    } else beginSeg(r);
  }
}
const walkRing = document.getElementById('walkRing');
const statusTextEl = document.getElementById('statusText');
let lastStatus = '';
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  if (!REDUCED) {
    ROLES.forEach(r => {
      if (r.state === 'seated') { r.idleT -= dt; if (r.idleT <= 0 && !startTrip(r)) r.idleT = 0.5; }
      else stepWalk(r, dt);
      r.bubbleWrap.setAttribute('transform', `translate(${r.pos.x},${r.pos.y - 126})`);
      r.walker.setAttribute('transform', `translate(${r.pos.x},${r.pos.y})`);
      r.flip.style.transform = r.facing < 0 ? 'scale(-1,1)' : 'scale(1,1)';
    });
    const a = ROLES[idx];
    if (a.state !== 'seated') {
      walkRing.setAttribute('cx', a.pos.x); walkRing.setAttribute('cy', a.pos.y + 3);
      walkRing.style.opacity = 1;
    } else walkRing.style.opacity = 0;
    const st = a.state !== 'seated'
      ? `${a.short} lagi bawa <b>${a.shortFile}</b> ke ${a.destLabel}…`
      : a.status;
    if (st !== lastStatus) { statusTextEl.innerHTML = st; lastStatus = st; }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const rail = document.getElementById('rail');
const statusText = document.getElementById('statusText');
let idx = 0, timer = null;
function show(n) {
  idx = (n + ROLES.length) % ROLES.length;
  const r = ROLES[idx];
  document.querySelectorAll('.bubble').forEach(b => b.classList.toggle('on', b.dataset.bubble === r.id));
  ROLES.forEach(x => { const ring = document.getElementById('ring-' + x.id); if (ring) ring.style.opacity = x.id === r.id ? 1 : 0; });
  rail.querySelectorAll('span').forEach(s => s.classList.toggle('on', s.dataset.step === r.step));
  statusText.innerHTML = r.status;
  /* the active role usually walks off carrying their handoff */
  if (Math.random() < 0.7) startTrip(r);
}
function next() { show(idx + 1); }
function restart() { clearInterval(timer); timer = setInterval(next, 3000); }
show(0); restart();
document.querySelectorAll('[data-role]').forEach(g =>
  g.addEventListener('click', () => { show(ROLES.findIndex(r => r.id === g.dataset.role)); restart(); }));

/* debug hook for verification */
window.__office = {
  positions: () => ROLES.map(r => ({ id: r.id, x: Math.round(r.pos.x), y: Math.round(r.pos.y), state: r.state, dest: r.destLabel || null })),
  walkingCount: () => ROLES.filter(r => r.state !== 'seated').length,
  activeRole: () => ROLES[idx].id,
};
</script>
</body>
